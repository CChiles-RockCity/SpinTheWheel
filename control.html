<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spin the Wheel — Control</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="control">
  <div class="wrap control">
    <div id="banner" class="banner" data-state="idle">
      <div>
        <div id="big" class="big">Connecting…</div>
        <div id="sub" class="sub"></div>
      </div>
      <button id="spin" type="button" class="spin" disabled>SPIN</button>
    </div>

    <div class="tools">
      <span><span id="dot" class="dot off"></span><span id="connText">Connecting…</span></span>
      <span>Type a book (<kbd>psa</kbd>, <kbd>1jo</kbd>), <kbd>Enter</kbd> spins, <kbd>Esc</kbd> clears</span>
      <span id="typed" class="typed-line"></span>
      <label><input id="auto" type="checkbox"> Spin as soon as a book is picked</label>
      <label>Spin time <input id="duration" type="number" min="1" max="30" step="1" value="5" style="width:3.6em"> s</label>
      <button id="clear" type="button">Clear selection</button>
    </div>

    <div id="books" class="books"></div>
  </div>

  <script src="src/books.js"></script>
  <script src="src/machine.js"></script>
  <script src="src/engine.js"></script>
  <script src="src/picker.js"></script>
  <script src="src/remote.js"></script>
  <script src="src/control.js"></script>
</body>
</html>
